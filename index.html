<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">

<title>삼국 사우스파크</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0c14; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; touch-action: none; }
  @supports (height: 100dvh) { canvas { max-height: 100dvh; max-width: 177.78dvh; } }
  #rot { display: none; position: fixed; inset: 0; z-index: 9; background: #0a0c14; color: #ffd34d; font: 700 6vw/1.5 sans-serif; text-align: center; align-items: center; justify-content: center; padding: 0 8vw; }
  @media (orientation: portrait) and (pointer: coarse) { #rot { display: flex; } }
</style>
</head>

<canvas id="c" width="1280" height="720"></canvas>
<div id="rot">📱 화면을 가로로 돌려 주세요<br>(삼국 사우스파크는 가로 화면용입니다)</div>
